apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-memory-bound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-bound
  template:
    metadata:
      labels:
        app: memory-bound
    spec:
      containers:
        - name: app-memory-bound
          image: mateusmf4/memory-bound-api
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: app-memory-bound
spec:
  type: NodePort
  selector:
    app: memory-bound
  ports:
    - port: 8803
      targetPort: 8000
      nodePort: 30083