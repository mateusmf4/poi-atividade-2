apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-cpu-bound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-bound
  template:
    metadata:
      labels:
        app: cpu-bound
    spec:
      containers:
        - name: app-cpu-bound
          image: fluiz22/cpu-bound-api
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: app-cpu-bound
spec:
  type: NodePort
  selector:
    app: cpu-bound
  ports:
    - port: 8802
      targetPort: 8000
      nodePort: 30082