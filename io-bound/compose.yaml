services:
  postgres:
    image: postgres:17
    container_name: postgres-loucos-por-cafe
    environment:
      POSTGRES_DB: loucos-por-cafe
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d loucos-por-cafe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
